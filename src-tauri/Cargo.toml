[package]
name = "qtchart"
version = "0.1.0"
description = "QT Chart：看盤軟體（OKX USDT 永續）"
edition = "2021"

[lib]
name = "qtchart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.12"
tokio = { version = "1", features = ["macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-notification = "2"
# signing the requests of the user's own OKX API key (trade.rs)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# Windows only: ask WebView2 to use less memory while the window is minimized (window.rs)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# the API key is kept encrypted with the Windows user's own key (DPAPI)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
